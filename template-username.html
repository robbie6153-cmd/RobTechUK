<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
Choose Username
</title>

<link
rel="stylesheet"
href="template.css?v=3"
>

</head>

<body class="login-page">

<main class="login-wrapper">

<section class="login-card">

<h1>
Choose a Username
</h1>

<p class="login-intro">

Your username will be visible to other members.

</p>

<form
id="usernameForm"
class="login-form"
>

<label
for="username"
>

Username

</label>

<input
id="username"
type="text"
maxlength="20"
autocomplete="off"
placeholder="Choose a username"
required
>

<button
type="submit"
class="login-main-button"
>

Continue

</button>

</form>

<p
id="usernameMessage"
class="login-message"
></p>

</section>

</main>

<script
type="module"
src="template-username.js?v=1"
></script>

</body>

</html>
