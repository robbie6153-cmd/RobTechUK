<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Get a Free Quote - RobTechUK
  </title>

  <meta
    name="description"
    content="Request a free website quote from RobTechUK."
  />

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      color: #fff;
    }

    .page {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 18px;
    }

    .top-bar {
      margin-bottom: 18px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border: 2px solid #00ff37;
      border-radius: 14px;
      color: #fff;
      background: #071007;
      text-decoration: none;
      font-size: 26px;
      font-weight: bold;
      box-shadow: 0 0 12px rgba(0, 255, 55, 0.5);
    }

    .quote-card {
      padding: 26px 20px;
      border: 2px solid #00ff37;
      border-radius: 22px;
      background: #050905;
      box-shadow: 0 0 22px rgba(0, 255, 55, 0.28);
    }

    h1 {
      margin: 0 0 12px;
      text-align: center;
      font-size: 38px;
      color: #fff;
      text-shadow: 0 0 10px rgba(0, 255, 55, 0.55);
    }

    .intro {
      max-width: 560px;
      margin: 0 auto 26px;
      text-align: center;
      color: #ddd;
      font-size: 17px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 17px;
      font-weight: bold;
    }

    .optional {
      color: #aaa;
      font-size: 14px;
      font-weight: normal;
    }

    input,
    textarea {
      width: 100%;
      border: 2px solid #18d63f;
      border-radius: 12px;
      padding: 14px;
      background: #0b0f0b;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      outline: none;
    }

    input {
      min-height: 52px;
    }

    textarea {
      min-height: 170px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #00ff37;
      box-shadow: 0 0 12px rgba(0, 255, 55, 0.55);
    }

    input::placeholder,
    textarea::placeholder {
      color: #888;
    }

    .submit-btn {
      display: block;
      width: min(100%, 420px);
      min-height: 58px;
      margin: 8px auto 0;
      border: 2px solid #75ff8d;
      border-radius: 15px;
      background: #00d52f;
      color: #fff;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(0, 255, 55, 0.65);
    }

    .submit-btn:hover {
      background: #00ed35;
    }

    .response-time {
      margin: 18px 0 0;
      text-align: center;
      color: #ddd;
      font-size: 15px;
      line-height: 1.5;
    }

    .form-message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
    }

    .form-message.success {
      display: block;
      border: 1px solid #00ff37;
      background: rgba(0, 255, 55, 0.12);
      color: #aaffbb;
    }

    .form-message.error {
      display: block;
      border: 1px solid #ff5555;
      background: rgba(255, 60, 60, 0.12);
      color: #ffb6b6;
    }

    .privacy-note {
      margin: 14px 0 0;
      text-align: center;
      color: #999;
      font-size: 13px;
      line-height: 1.4;
    }

    .privacy-note a {
      color: #53ff72;
    }

    @media (max-width: 520px) {

      .page {
        padding: 12px;
      }

      .quote-card {
        padding: 22px 15px;
        border-radius: 18px;
      }

      h1 {
        font-size: 32px;
      }

    }

  </style>

</head>

<body>

  <div class="page">

    <header class="top-bar">

      <a
        class="back-btn"
        href="index.html"
        aria-label="Back to homepage"
      >
        ←
      </a>

    </header>

    <main class="quote-card">

      <h1>
        Get a Free Quote
      </h1>

      <p class="intro">
        Tell us a little about the website you need and we will get back to you
        with an initial quote.
      </p>

      <form id="quoteForm">

        <div class="form-group">

          <label for="name">
            Name
          </label>

          <input
            id="name"
            name="name"
            type="text"
            maxlength="100"
            autocomplete="name"
            placeholder="Your name"
            required
          />

        </div>

        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            name="email"
            type="email"
            maxlength="150"
            autocomplete="email"
            placeholder="Your email address"
            required
          />

        </div>

        <div class="form-group">

          <label for="phone">
            Phone
            <span class="optional">
              (optional)
            </span>
          </label>

          <input
            id="phone"
            name="phone"
            type="tel"
            maxlength="40"
            autocomplete="tel"
            placeholder="Your phone number"
          />

        </div>

        <div class="form-group">

          <label for="description">
            Describe your website
          </label>

          <textarea
            id="description"
            name="description"
            maxlength="3000"
            placeholder="Tell us what the website is for, the pages or features you need, and anything else that may help us understand your idea."
            required
          ></textarea>

        </div>

        <button
          id="submitQuoteBtn"
          class="submit-btn"
          type="submit"
        >
          Submit Request
        </button>

        <div
          id="formMessage"
          class="form-message"
          role="status"
          aria-live="polite"
        ></div>

        <p class="response-time">
          We will try to respond to all enquiries within 24 hours.
        </p>

        <p class="privacy-note">
          Your details will only be used to respond to your enquiry.
          <a href="privacy.html">
            View our Privacy Policy
          </a>.
        </p>

      </form>

    </main>

  </div>

  <script>

  const quoteForm =
    document.getElementById(
      "quoteForm"
    );

  const submitQuoteBtn =
    document.getElementById(
      "submitQuoteBtn"
    );

  const formMessage =
    document.getElementById(
      "formMessage"
    );


  function showMessage(
    message,
    type
  ) {
    formMessage.textContent =
      message;

    formMessage.className =
      `form-message ${type}`;
  }


  quoteForm.addEventListener(
    "submit",
    async event => {
      event.preventDefault();

      const quoteData = {
        _subject:
          "New RobTechUK Website Quote Request",

        Name:
          document
            .getElementById("name")
            .value
            .trim(),

        Email:
          document
            .getElementById("email")
            .value
            .trim(),

        Phone:
          document
            .getElementById("phone")
            .value
            .trim() || "Not provided",

        "Website Description":
          document
            .getElementById("description")
            .value
            .trim()
      };


      submitQuoteBtn.disabled =
        true;

      submitQuoteBtn.textContent =
        "Sending Request...";

      formMessage.className =
        "form-message";

      formMessage.textContent =
        "";


      try {

        const response =
          await fetch(
            "https://formsubmit.co/ajax/robbie6153@icloud.com",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "Accept":
                  "application/json"
              },

              body:
                JSON.stringify(
                  quoteData
                )
            }
          );


        if (!response.ok) {
          throw new Error(
            "Email failed"
          );
        }


        quoteForm.reset();

        showMessage(
          "Thank you. Your request has been sent successfully.",
          "success"
        );

      } catch (error) {

        console.error(
          "Quote request failed:",
          error
        );

        showMessage(
          "Your request could not be sent. Please try again.",
          "error"
        );

      } finally {

        submitQuoteBtn.disabled =
          false;

        submitQuoteBtn.textContent =
          "Submit Request";

      }
    }
  );

</script>

</body>

</html>
